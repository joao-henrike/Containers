# ==============================================================================
# Forensics Professional — Docker Compose
# ==============================================================================
# Quick start:
#   docker compose build
#   docker compose up -d
#   docker compose exec forensics bash
#
# Privileged mode is OFF by default. If you need to mount disk images via loop
# devices for live analysis, copy this file to docker-compose.override.yml and
# add `privileged: true` (see docs/PRIVILEGED_MODE.md for the trade-offs).
# ==============================================================================

services:
  forensics:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: "22.04"
    image: forensics-professional:3.0.0
    container_name: forensics-workstation
    hostname: forensics-lab
    restart: unless-stopped

    # Interactive shell
    stdin_open: true
    tty: true

    # ── Privilege model ──────────────────────────────────────────────────────
    # No privileged: true. Specific capabilities only.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN              # entrypoint fixes mounted-volume ownership
      - DAC_OVERRIDE       # read evidence regardless of user perms
      - FOWNER             # chmod on owned files
      - SETGID
      - SETUID
      - NET_RAW            # tcpdump / packet capture
      - NET_ADMIN          # interface configuration
      - SYS_PTRACE         # strace / ltrace for live analysis
      - LINUX_IMMUTABLE    # chattr +a on the audit log

    # Block any new privilege gains beyond the cap_add list above.
    security_opt:
      - no-new-privileges:true
      # AppArmor is intentionally left to the default Docker profile.

    # ── Resources (override per host) ────────────────────────────────────────
    # Compose v2 honours these directly; no `deploy:` block needed.
    mem_reservation: 2g
    pids_limit: 4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # ── Environment ─────────────────────────────────────────────────────────
    environment:
      TZ: UTC
      FORENSICS_USER: sherlock
      FORENSICS_HOST_UID: "${HOST_UID:-1000}"
      FORENSICS_HOST_GID: "${HOST_GID:-1000}"

    # ── Volumes ─────────────────────────────────────────────────────────────
    volumes:
      # Evidence: read-only — cannot be modified or deleted from inside.
      - type: bind
        source: ./evidence
        target: /evidence
        read_only: true

      # Working directory for the analyst
      - type: bind
        source: ./cases
        target: /cases

      # Audit logs (persisted across container restarts)
      - type: bind
        source: ./logs
        target: /var/log/forensics

      # Cryptographic keys (Ed25519, GPG, optional ML-DSA-65)
      - type: bind
        source: ./keys
        target: /opt/forensics/quantum-keys

      # Generated reports
      - type: bind
        source: ./reports
        target: /reports

      # User configuration overrides
      - type: bind
        source: ./config
        target: /etc/forensics
        read_only: true

    # ── Healthcheck (defined in Dockerfile) is honoured automatically ───────

    labels:
      org.opencontainers.image.title: "forensics-professional"
      org.opencontainers.image.version: "3.0.0"
      forensics.compliance: "NIST-SP-800-86"

# ──────────────────────────────────────────────────────────────────────────────
# To use Docker secrets (recommended for production), uncomment below and
# replace the bind mount in `volumes:` for ./keys with the secret path.
#
# secrets:
#   pqc_private_key:
#     file: ./keys/dilithium_private.key.enc
#   gpg_passphrase:
#     file: ./keys/.gpg.passphrase
# ──────────────────────────────────────────────────────────────────────────────
