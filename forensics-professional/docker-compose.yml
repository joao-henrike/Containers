# ==============================================================================
# Forensics Professional — Docker Compose
# ==============================================================================
# Quick start:
#   docker compose build
#   docker compose up -d
#   docker compose exec forensics bash
#
# Privileged mode is OFF by default. If you need to mount disk images via loop
# devices for live analysis, copy this file to docker-compose.override.yml and
# add `privileged: true` (see docs/PRIVILEGED_MODE.md for the trade-offs).
# ==============================================================================

services:
  forensics:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: "22.04"
        SHERLOCK_UID: "${HOST_UID:-1000}"
    image: forensics-professional:3.0.0
    container_name: forensics-workstation
    hostname: forensics-lab
    restart: unless-stopped

    # Interactive shell
    stdin_open: true
    tty: true

    # ── Privilege model ──────────────────────────────────────────────────────
    # We do NOT use `privileged: true`. Instead, we drop ALL capabilities and
    # add back only what the forensics tooling actually needs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN              # used only when an operator explicitly starts as root
      - DAC_OVERRIDE       # read evidence regardless of user perms
      - FOWNER             # chmod on owned files
      - SETGID             # gosu drops privilege; sudo invokes the narrow helper
      - SETUID
      - NET_RAW            # tcpdump / packet capture
      - NET_ADMIN          # interface configuration
      - SYS_PTRACE         # strace / ltrace for live analysis
      - LINUX_IMMUTABLE    # chattr +a on the audit log

    # ── Why no `no-new-privileges: true` ────────────────────────────────────
    # NB: `no-new-privileges` (PR_SET_NO_NEW_PRIVS) blocks setuid binaries from
    # escalating, which DEFEATS sudo. The only sudo command is the root-owned,
    # validating helper (config/forensics-privileged) for allowlisted APT
    # packages and the fixed audit-log append-only flag. Python tools install
    # into a sherlock-owned virtualenv and do not use sudo.
    #
    # The defence-in-depth is the root-owned argument-validating helper in
    # config/forensics-privileged. It accepts only fixed package names and one
    # fixed audit-log attribute operation; it does not edit APT sources, accept
    # shell commands, or permit arbitrary file placement. Build/runtime
    # validation is required before treating this boundary as verified.
    # See SECURITY.md for the remaining limitations.

    # ── Resources (override per host) ────────────────────────────────────────
    # Compose v2 honours these directly; no `deploy:` block needed.
    mem_reservation: 2g
    pids_limit: 4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # ── Environment ─────────────────────────────────────────────────────────
    environment:
      TZ: UTC
      FORENSICS_USER: sherlock

    # ── Volumes ─────────────────────────────────────────────────────────────
    volumes:
      # Evidence: read-only — cannot be modified or deleted from inside.
      - type: bind
        source: ./evidence
        target: /evidence
        bind:
          create_host_path: false
        read_only: true

      # Working directory for the analyst
      - type: bind
        source: ./cases
        target: /cases
        bind:
          create_host_path: false

      # Audit logs (persisted across container restarts)
      - type: bind
        source: ./logs
        target: /var/log/forensics
        bind:
          create_host_path: false

      # Cryptographic keys (Ed25519, GPG, optional ML-DSA-65)
      - type: bind
        source: ./keys
        target: /opt/forensics/quantum-keys
        bind:
          create_host_path: false

      # Generated reports
      - type: bind
        source: ./reports
        target: /reports
        bind:
          create_host_path: false

      # User configuration overrides — only the public config; sudoers fragment
      # is baked into the image at build time, NOT bind-mounted.
      - type: bind
        source: ./config/config.yaml
        target: /etc/forensics/config.yaml
        read_only: true
        bind:
          create_host_path: false

    # ── Healthcheck (defined in Dockerfile) is honoured automatically ───────

    labels:
      org.opencontainers.image.title: "forensics-professional"
      org.opencontainers.image.version: "3.0.0"
      forensics.compliance: "NIST-SP-800-86"

# ──────────────────────────────────────────────────────────────────────────────
# To use Docker secrets (recommended for production), uncomment below and
# replace the bind mount in `volumes:` for ./keys with the secret path.
#
# secrets:
#   pqc_private_key:
#     file: ./keys/dilithium_private.key.enc
#   gpg_passphrase:
#     file: ./keys/.gpg.passphrase
# ──────────────────────────────────────────────────────────────────────────────
