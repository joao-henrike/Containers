[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensics-professional"
description = "Digital forensics workstation with auditable evidence handling."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "joao-henrike"}]
keywords = ["forensics", "incident-response", "audit", "post-quantum"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dynamic = ["version"]
dependencies = [
    "cryptography>=43.0.0",
    "PyYAML>=6.0",
    "psutil>=6.0",
    "tabulate>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
pqc = ["liboqs-python>=0.10.0", "argon2-cffi>=23.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
# Note: the actual CLIs are shell-installed under /opt/forensics during
# `docker compose build`. These entries exist so `pip install .` on a
# host system also produces working binaries (handy for unit tests).
forensics-modules = "forensics.modules.cli:main"
forensics-audit   = "forensics.audit.cli:main"
forensics-health  = "forensics.health.cli:main"

[project.urls]
Homepage      = "https://github.com/joao-henrike/Containers"
Documentation = "https://github.com/joao-henrike/Containers/tree/main/forensics-professional"
Issues        = "https://github.com/joao-henrike/Containers/issues"
Changelog     = "https://github.com/joao-henrike/Containers/blob/main/forensics-professional/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "core"}

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

# ── Tooling ───────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "RUF",              # ruff-specific
    "S",                # bandit-lite
    "SIM",              # simplify
]
ignore = [
    "E501",     # line length (handled by formatter)
    "S101",     # assert in tests is fine
    "S603",     # subprocess.run with shell=False is intentional
    "S607",     # full executable paths get platform-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
files = ["core/forensics"]

[[tool.mypy.overrides]]
module = ["oqs", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-v --tb=short --strict-markers"
testpaths = ["tests"]
pythonpath = ["core"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: tests that require Docker",
]
