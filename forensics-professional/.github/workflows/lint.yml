name: Lint

on:
  push:
    paths:
      - 'forensics-professional/**.py'
      - 'forensics-professional/**.sh'
      - 'forensics-professional/Dockerfile'
      - 'forensics-professional/pyproject.toml'
      - 'forensics-professional/.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'forensics-professional/**.py'
      - 'forensics-professional/**.sh'
      - 'forensics-professional/Dockerfile'
      - 'forensics-professional/pyproject.toml'

defaults:
  run:
    shell: bash
    working-directory: forensics-professional

jobs:
  python:
    name: Python (ruff + mypy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: forensics-professional/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check core/ tests/
      - run: mypy core/forensics

  shell:
    name: Shell (ShellCheck)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: 'forensics-professional'
          severity: warning
          ignore_paths: |
            forensics-professional/scripts/forensics-health
            forensics-professional/core/audit-system/forensics-audit
            forensics-professional/core/module-manager/forensics-modules

  dockerfile:
    name: Dockerfile (hadolint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: forensics-professional/Dockerfile
          ignore: DL3008,DL3013   # apt/pip "always pin" — we pin via reqs.txt
          failure-threshold: warning
